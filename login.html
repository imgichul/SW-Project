<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인 - 캠퍼스 중고 마트</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>🎓 캠퍼스 중고 마트</h1>
    <p>로그인</p>
  </header>

  <main class="container">
    <div class="form-box">
      <h2>로그인 페이지</h2>
      
      <form id="loginForm" action="#" method="POST">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required>

        <label for="password">비밀번호</label>
        <div style="position: relative; width: 100%;">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="비밀번호를 입력하세요"
            required
            style="width: 100%; padding-right: 52px; box-sizing: border-box;"
          >
          <button
            type="button"
            id="togglePasswordBtn"
            aria-label="비밀번호 보기"
            style="
              position: absolute;
              top: 50%;
              right: 12px;
              transform: translateY(-50%);
              border: none;
              background: transparent;
              cursor: pointer;
              font-size: 22px;
              padding: 0;
            "
          >
            <span id="togglePasswordIcon">🙈</span>
          </button>
        </div>

        <button type="submit" class="submit-btn">로그인</button>
      </form>

      <p style="text-align: center; margin-top: 20px; font-size: 14px;">
        아직 계정이 없으신가요? 
        <a href="signup.html" style="color: #007bff; text-decoration: none; font-weight: bold;">회원가입하기</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Campus Market. All rights reserved.</p>
  </footer>
  
  <script src="js/auth.js"></script>
</body>
</html>
