<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>판매글 등록</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>🎓 캠퍼스 중고 마트</h1>
    <p>판매글 등록</p>
  </header>

  <main class="container">
    <div class="form-box">
      <h2>판매글 등록</h2>

      <!-- 판매글 등록 폼 -->
      <form id="postForm">
        <label for="title">제목</label>
        <input type="text" id="title" placeholder="예: 아이패드 에어 5세대 판매합니다" required>

        <label for="price">가격</label>
        <input type="number" id="price" min="0" step="1000" placeholder="예: 550000" required>

        <label for="category">카테고리</label>
        <select id="category" required>
          <option value="">카테고리 선택</option>
          <option value="전자기기">전자기기</option>
          <option value="전공책">전공책</option>
          <option value="필기구">필기구</option>
          <option value="생활용품">생활용품</option>
          <option value="기타">기타</option>
        </select>

        <label for="location">거래 희망 장소</label>
        <input type="text" id="location" placeholder="예: 도서관 로비, 학생회관 앞" required>

        <label for="contact">연락처</label>
        <input type="text" id="contact" placeholder="예: 오픈채팅 링크 또는 전화번호" required>

        <!-- 상품 사진 선택: 선택한 이미지는 JavaScript에서 base64로 변환하여 저장 -->
        <label for="image">상품 사진</label>
        <input type="file" id="image" accept="image/*">

        <label for="description">설명</label>
        <textarea id="description" rows="6" placeholder="물품 상태, 사용 기간, 거래 방법 등을 입력하세요" required></textarea>

        <button type="submit" class="submit-btn">등록하기</button>
      </form>

      <a href="posts.html" class="back-link">목록으로 돌아가기</a>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Campus Market. All rights reserved.</p>
  </footer>

  <script type="module" src="js/posts.js"></script>
</body>
</html>
