<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캠퍼스 중고 마트</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>🎓 캠퍼스 중고 마트</h1>
    <p>우리 학교 학생들을 위한 안전한 중고거래 공간</p>
  </header>

  <div class="container">
    <div class="category-tabs">
      <div class="tab active">전체보기</div>
      <div class="tab">전자기기</div>
      <div class="tab">전공책</div>
      <div class="tab">필기구</div>
    </div>

    <div class="product-grid">
      <div class="product-card" data-category="전자기기">
        <div class="product-image">💻 전자기기 이미지</div>
        <div class="product-info">
          <span class="category-badge badge-electronic">전자기기</span>
          <h3 class="product-title">아이패드 에어 5세대 Wifi 64GB</h3>
          <div class="product-price">550,000원</div>
          <div class="product-meta">
            <span>방금 전</span>
            <span>공학관 앞 거래</span>
          </div>
        </div>
      </div>

      <div class="product-card" data-category="전공책">
        <div class="product-image">📚 전공책 이미지</div>
        <div class="product-info">
          <span class="category-badge badge-book">전공책</span>
          <h3 class="product-title">컴퓨터 구조 및 설계 (개정 6판)</h3>
          <div class="product-price">25,000원</div>
          <div class="product-meta">
            <span>10분 전</span>
            <span>도서관 로비</span>
          </div>
        </div>
      </div>

      <div class="product-card" data-category="필기구">
        <div class="product-image">✏️ 필기구 이미지</div>
        <div class="product-info">
          <span class="category-badge badge-pencil">필기구</span>
          <h3 class="product-title">애플펜슬 2세대 (거의 새것)</h3>
          <div class="product-price">90,000원</div>
          <div class="product-meta">
            <span>30분 전</span>
            <span>학생회관</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/posts.js"></script>
</body>
</html>
